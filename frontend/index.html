<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot | Smart Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="chat-header">
            <div class="header-content">
                <i class="fas fa-robot"></i>
                <h2>AI Smart Assistant</h2>
            </div>
            <div class="header-controls">
                <button id="clearChat" class="clear-btn">
                    <i class="fas fa-trash-alt"></i> Clear
                </button>
                <button id="toggleTheme" class="theme-btn">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <i class="fas fa-robot"></i>
                <h3>Welcome to AI Chatbot!</h3>
                <p>Ask me anything, I'm here to help you 24/7.</p>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span>AI is thinking...</span>
        </div>
        
        <div class="chat-input-container">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="Type your message here..." 
                    rows="1"
                    maxlength="500"
                ></textarea>
                <button id="sendMessage" class="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="input-footer">
                <span class="char-count">0/500</span>
                <span class="info-text">Press Enter to send</span>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
